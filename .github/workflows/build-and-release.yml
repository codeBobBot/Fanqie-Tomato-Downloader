name: 构建与发布

on:
  release:
    types: [created]
  workflow_dispatch:  # 允许手动触发工作流
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '是否为预发布版本'
        required: true
        type: boolean
        default: false

# 添加必要的权限
permissions:
  contents: write  # 允许写入仓库内容，需要这个来创建release
  packages: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        
      - name: 设置Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 运行单元测试
        run: |
          pip install pytest -q
          python -m pytest tests/ -v
          
      - name: 确保cookie.json存在
        run: |
          if (-not (Test-Path -Path "./cookie.json")) {
            '""' | Out-File -FilePath "./cookie.json" -Encoding utf8
          }
          
      - name: 构建Windows可执行文件
        run: |
          python build_exe.py
          
      - name: 压缩Windows可执行文件
        run: |
          Compress-Archive -Path dist/番茄小说下载器.exe -DestinationPath Fanqie-Novel-Downloader-Windows.zip
          
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          path: Fanqie-Novel-Downloader-Windows.zip
          
      - name: 上传至已存在的Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: Fanqie-Novel-Downloader-Windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  # 为MacOS构建
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        
      - name: 设置Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 运行单元测试
        run: |
          pip install pytest -q
          python -m pytest tests/ -v
          
      - name: 确保cookie.json存在
        run: |
          if [ ! -f "./cookie.json" ]; then
            echo '""' > "./cookie.json"
          fi
          
      - name: 准备构建脚本
        run: |
          # 修改为macOS格式的路径分隔符（build_exe.py 使用 Windows 的 ; 分隔符）
          sed -i '' 's/--add-data=novel_downloader.py;./--add-data=novel_downloader.py:./' build_exe.py
          sed -i '' 's/--add-data=cookie.json;./--add-data=cookie.json:./' build_exe.py
          
      - name: 构建MacOS可执行文件
        run: |
          python build_exe.py
          
      - name: 压缩MacOS可执行文件
        run: |
          cd dist && zip -r ../Fanqie-Novel-Downloader-MacOS.zip 番茄小说下载器
          
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-build
          path: Fanqie-Novel-Downloader-MacOS.zip
          
      - name: 上传至已存在的Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: Fanqie-Novel-Downloader-MacOS.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  # 为Linux构建
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        
      - name: 设置Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 运行单元测试
        run: |
          pip install pytest -q
          python -m pytest tests/ -v
          
      - name: 确保cookie.json存在
        run: |
          if [ ! -f "./cookie.json" ]; then
            echo '""' > "./cookie.json"
          fi
          
      - name: 准备构建脚本
        run: |
          # 修改为Linux格式的路径分隔符（build_exe.py 使用 Windows 的 ; 分隔符）
          sed -i 's/--add-data=novel_downloader.py;./--add-data=novel_downloader.py:./' build_exe.py
          sed -i 's/--add-data=cookie.json;./--add-data=cookie.json:./' build_exe.py
          
      - name: 构建Linux可执行文件
        run: |
          python build_exe.py
          
      - name: 压缩Linux可执行文件
        run: |
          cd dist && zip -r ../Fanqie-Novel-Downloader-Linux.zip 番茄小说下载器
          
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-build
          path: Fanqie-Novel-Downloader-Linux.zip
          
      - name: 上传至已存在的Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: Fanqie-Novel-Downloader-Linux.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  # 创建发布版本
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 下载Windows构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-build
          
      - name: 下载MacOS构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-build
          
      - name: 下载Linux构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-build
          
      - name: 创建Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          name: Fanqie Novel Downloader ${{ inputs.version }}
          body: |
            Fanqie Novel Downloader ${{ inputs.version }} Release
            
            ### Features
            - Download novels from Fanqie and export as TXT or EPUB format
            - Support multi-threaded downloading for acceleration
            - CI quality gate: unit tests pass before packaging
            
            ### Downloads
            - Windows: Fanqie-Novel-Downloader-Windows.zip
            - macOS: Fanqie-Novel-Downloader-MacOS.zip
            - Linux: Fanqie-Novel-Downloader-Linux.zip
          files: |
            Fanqie-Novel-Downloader-Windows.zip
            Fanqie-Novel-Downloader-MacOS.zip
            Fanqie-Novel-Downloader-Linux.zip
          draft: false
          prerelease: ${{ inputs.prerelease }}